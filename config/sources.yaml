    - { id: "2610.18427", title: "Reliable Memory from Unstable Growth (RBC)" }
    - { id: "2608.28476", title: "ContextPilot" }
    - { id: "2610.04433", title: "Prefix re-read cost on SWE-bench Verified" }
    - { id: "2609.24144", title: "Luck Is Not Skill" }
    - { id: "2605.00347", title: "Odysseus" }
    - { id: "2609.36802", title: "EasyPPO" }
    - { id: "2608.08020", title: "Gambit" }

github:
  api: https://api.github.com
  token_env: GITHUB_TOKEN          # on Jacob's PC: `gh auth login` suffices; in cloud sessions attach the repos read-only
  window_days: 14
  repos:
    - { repo: volcengine/verl, keywords: [rollout, async, "partial rollout", advantage, "step-level", "KV", "prefix cache", snapshot] }
    - { repo: NovaSky-AI/SkyRL, keywords: [rollout, async, advantage, sandbox, snapshot] }
    - { repo: All-Hands-AI/OpenHands, keywords: [condenser, compaction, "context window", sandbox, snapshot, trajectory, RL] }
    - { repo: SWE-agent/SWE-agent, keywords: [trajectory, cost, "context", history, RL] }
    - { repo: sierra-research/tau2-bench, keywords: [simulator, "user", variance, pass, trials, temperature, seed] }
    - { repo: princeton-pli/hal-harness, keywords: [cost, tokens, reliability, "pass^k", runs, traces] }
    - { repo: vllm-project/vllm, keywords: ["prefix cache", "prompt_logprobs", "KV cache", RL, rollout, "batch invariant"] }
    - { repo: sgl-project/sglang, keywords: ["radix", "KV cache", rollout, RL, deterministic] }

conference_exports:
  venues:
    - { venue: NeurIPS, year: 2026, url: "https://neurips.cc/Downloads/2026" }
    - { venue: ICLR, year: 2027, url: "https://iclr.cc/Downloads/2027", note: "appears after decisions, ~Jan 2027" }
    - { venue: ICML, year: 2027, url: "https://icml.cc/Downloads/2027", note: "appears ~May 2027" }
  openreview_venues:
    - "ICLR.cc/2027/Conference"

pressure:
  # stage 6b inputs, re-read monthly (prompts/06_pressure.md)
  system_cards: [Anthropic, OpenAI, Google DeepMind, xAI, Meta, Moonshot, Alibaba Qwen, DeepSeek, ByteDance Seed]
  leaderboards: [HAL, SWE-rebench, Terminal-Bench, tau2-bench, OSWorld, BrowseComp, Artificial Analysis, Epoch, METR]
  blogs: [Anthropic engineering, OpenAI, Cursor, Cognition, Manus, Factory, Sierra, Thinking Machines, LangChain]

workshops_and_cfps:
  - "NeurIPS 2026 workshops: AgenticOS; Agentic AI Benchmark; AI for Meta-Science"
  - "MLSys 2027 CFP: large-scale RL for LLMs and agentic systems"
  - "ICML 2027 workshops: RL-for-LLMs, agents, systems"

limitations_sections:
