# Streams the fetchers read. Four kinds, by what they are good for:
#   watch     : what the groups in our lanes are doing (arXiv by query, by author, by citation)
#   import    : other fields' standard answers to the same problem shapes (see config/fields.yaml)
#   complaint : what practitioners cannot do (GitHub issues, limitations sections, workshop calls)
#   pressure  : system cards, leaderboards, meta-papers, engineering blogs (stage 6b, monthly)
# Every query names its stream and the lanes it serves (config/themes.yaml, lanes L1–L5).
# Density lesson (W41–W42): queries must carry mechanism words AND the field's role words; problem
# vocabulary alone found a fraction of the neighbors.

version: 2026-10-19

# Scout stream (2026-10-19, Jacob: lanes are priorities, not walls — stay open to new themes). The papers the community
# is reading this week regardless of our lanes: Hugging Face daily papers rank arXiv papers by reader upvotes. Triage
# judges scouts on the headline test (prompts/00_triage.md) and keeps at most `scout_quota_per_week`
# (config/generation.yaml) as lane L0. Three scouts on one theme propose a lane in the digest.
scout:
  enabled: true
  hf_daily_url: https://huggingface.co/api/daily_papers
  window_days: 7
  top_per_day: 6              # always consider the day's top 6 by upvotes ...
  min_upvotes: 60             # ... plus anything past this bar (about 50 scouts a week; triage keeps at most 5)

arxiv:
  base_url: https://export.arxiv.org/api/query
  pause_seconds: 3            # arXiv's stated policy
  window_days: 7
  max_results_per_query: 50
  categories: [cs.LG, cs.CL, cs.AI, cs.DC, cs.SE, cs.MA, cs.RO]   # cs.RO added 2026-10-19 for L5 (robot learning)
  queries:
    # ---- L1 evaluation and measurement ----
    - id: q_reliability_passk
      stream: watch
      themes: [L1]
      q: '(abs:"pass^k" OR abs:"pass@k" OR abs:reliability OR abs:"run-to-run" OR abs:variance) AND (abs:agent OR abs:agentic OR abs:benchmark) AND (abs:LLM OR abs:"language model")'
    - id: q_benchmark_validity
      stream: watch
      themes: [L1]
      q: '(abs:benchmark) AND (abs:validity OR abs:saturation OR abs:contamination OR abs:"construct" OR abs:psychometric OR abs:"item response" OR abs:"factor") AND (abs:agent OR abs:LLM)'
    - id: q_effort_scaffold
      stream: watch
      themes: [L1]
      q: '(abs:"reasoning effort" OR abs:"thinking budget" OR abs:"test-time compute" OR abs:scaffold OR abs:harness) AND (abs:agent OR abs:agentic) AND (abs:"non-monotonic" OR abs:degrad OR abs:hurt OR abs:"does not")'
    - id: q_user_simulator
      stream: watch
      themes: [L1]
      q: '(abs:"user simulator" OR abs:"simulated user" OR abs:"user simulation" OR abs:"LLM-as-user") AND (abs:fidelity OR abs:variance OR abs:consisten OR abs:error OR abs:reliability OR abs:"tau-bench")'
    - id: q_variance_attribution
      stream: watch
      themes: [L1, L2]
      q: '(abs:"skill" AND abs:"luck") OR (abs:"variance decomposition" AND abs:agent) OR (abs:"law of total variance" AND abs:LLM) OR (abs:"generalizability theory" AND abs:agent)'
    # ---- L2 long-horizon RL dynamics ----
    - id: q_long_horizon_critic
      stream: watch
      themes: [L2]
      q: '(abs:critic OR abs:"value function" OR abs:"value model" OR abs:"explained variance") AND (abs:"long-horizon" OR abs:"multi-turn" OR abs:agentic) AND (abs:"reinforcement learning" OR abs:PPO OR abs:GRPO)'
    - id: q_mas_credit
      stream: watch
      themes: [L2, L4]
      q: '(abs:"multi-agent" OR abs:orchestrator OR abs:"sub-agent" OR abs:subagent) AND (abs:"credit assignment" OR abs:counterfactual OR abs:contrastive OR abs:"marginal contribution") AND (abs:LLM OR abs:"language model")'
    - id: q_compaction_rl
      stream: watch
      themes: [L2, L4]
      q: '(abs:"context compression" OR abs:compaction OR abs:"context folding" OR abs:"context management" OR abs:summarization) AND (abs:agent) AND (abs:"reinforcement learning" OR abs:GRPO OR abs:RL)'
    - id: q_forgetting_transfer
      stream: watch
      themes: [L2]
      q: '(abs:forgetting OR abs:transfer OR abs:"catastrophic") AND (abs:agentic OR abs:agent) AND (abs:"reinforcement learning" OR abs:"post-training") AND (abs:"on-policy" OR abs:retain)'
    # ---- L3 systems and cost ----
    - id: q_rollout_systems
      stream: watch
      themes: [L3]
      q: '(abs:rollout OR abs:"KV cache" OR abs:"prefix caching" OR abs:snapshot) AND (abs:"reinforcement learning" OR abs:RLHF OR abs:"post-training") AND (abs:throughput OR abs:scheduler OR abs:serving OR abs:"system")'
    - id: q_agent_cost
      stream: watch
      themes: [L3, L1]
      q: '(abs:cost OR abs:"input tokens" OR abs:cached OR abs:"prefix") AND (abs:agent OR abs:agentic) AND (abs:"long-horizon" OR abs:steps OR abs:trajectory) AND (abs:measure OR abs:accounting OR abs:leaderboard)'
    - id: q_async_rl_infra
      stream: watch
      themes: [L3]
      q: '(abs:asynchronous OR abs:async OR abs:straggler OR abs:"partial rollout" OR abs:"off-policy") AND (abs:"reinforcement learning") AND (abs:LLM OR abs:agent) AND (abs:system OR abs:framework OR abs:throughput)'
    - id: q_sandbox_state
      stream: watch
      themes: [L3]
      q: '(abs:sandbox OR abs:container OR abs:"environment state" OR abs:checkpoint OR abs:"overlay") AND (abs:agent) AND (abs:"reinforcement learning" OR abs:rollout OR abs:fork)'
    # ---- L4 context, memory, handoffs ----
    - id: q_context_memory_measure
      stream: watch
      themes: [L4, L1]
      q: '(abs:"context compression" OR abs:compaction OR abs:memory OR abs:playbook OR abs:consolidation) AND (abs:agent) AND (abs:evaluat OR abs:benchmark OR abs:"information loss" OR abs:variance OR abs:collapse)'
    - id: q_subagent_handoff
      stream: watch
      themes: [L4]
      q: '(abs:"sub-agent" OR abs:subagent OR abs:orchestrator OR abs:delegation OR abs:handoff) AND (abs:brief OR abs:summary OR abs:"context" OR abs:message) AND (abs:LLM OR abs:"language model")'
    - id: q_self_evolving_memory
      stream: watch
      themes: [L4]
      q: '(abs:"self-evolving" OR abs:"self-improving" OR abs:"self-improvement") AND (abs:agent) AND (abs:memory OR abs:playbook OR abs:experience OR abs:reflection) AND (abs:curator OR abs:reflector OR abs:"write-time" OR abs:gate OR abs:variance)'
    # ---- L5 simulator verification and validation for robot learning ----
    - id: q_sim_contact_exploit
      stream: watch
      themes: [L5]
      q: '(abs:simulator OR abs:simulation OR abs:"physics engine") AND (abs:exploit OR abs:artifact OR abs:interpenetration OR abs:"reward hacking" OR abs:penetration) AND (abs:"reinforcement learning" OR abs:policy OR abs:"sim-to-real")'
    - id: q_sim_solver_caps
      stream: watch
      themes: [L5, L3]
      q: '(abs:"physics engine" OR abs:simulator OR abs:"batched simulation" OR abs:"GPU simulation") AND (abs:"solver iterations" OR abs:convergence OR abs:"time step" OR abs:Newton OR abs:"conjugate gradient" OR abs:throughput OR abs:straggler)'
    - id: q_sim_vv_gap
      stream: watch
      themes: [L5]
      q: '(abs:"sim-to-real" OR abs:"reality gap" OR abs:"sim2real") AND (abs:contact OR abs:friction OR abs:impact OR abs:validation OR abs:verification OR abs:fidelity) AND (abs:robot OR abs:manipulation OR abs:locomotion)'
    - id: q_sim_engines_new
      stream: watch
      themes: [L5]
      q: '(abs:"MuJoCo Warp" OR abs:MJX OR abs:Genesis OR abs:"Isaac Lab" OR abs:"Newton" OR abs:PhysX OR abs:Warp) AND (abs:simulation OR abs:simulator) AND (abs:robot OR abs:"reinforcement learning")'
    - id: q_sim_speculative
      stream: watch
      themes: [L5, L3]
      q: '(abs:speculative OR abs:rollback OR abs:"draft and verify" OR abs:"lossless") AND (abs:policy OR abs:VLA OR abs:simulator OR abs:"physics engine") AND (abs:robot OR abs:control OR abs:simulation)'
    # ---- import stream: other fields' standard answers (config/fields.yaml) ----
    - id: q_import_gtheory_irt
      stream: import
      themes: [L1]
      q: '(abs:"generalizability theory" OR abs:"item response theory" OR abs:"measurement invariance" OR abs:"test-retest") AND (abs:LLM OR abs:"language model" OR abs:agent OR abs:benchmark)'
    - id: q_import_sequential
      stream: import
      themes: [L1, L3]
      q: '(abs:"sequential testing" OR abs:"anytime-valid" OR abs:"e-value" OR abs:"always valid") AND (abs:LLM OR abs:evaluation OR abs:benchmark OR abs:"A/B")'
    - id: q_import_rate_distortion
      stream: import
      themes: [L4]
      q: '(abs:"rate-distortion" OR abs:"information bottleneck" OR abs:"sufficient statistic") AND (abs:context OR abs:memory OR abs:summar) AND (abs:LLM OR abs:agent)'
    - id: q_import_game_equity
      stream: import
      themes: [L1]
      q: '(abs:equity OR abs:"luck" OR abs:"skill") AND (abs:backgammon OR abs:poker OR abs:chess OR abs:"win probability") AND (abs:attribution OR abs:decomposition OR abs:martingale)'
    - id: q_import_doe
      stream: import
      themes: [L1, L2]
      q: '(abs:"Neyman allocation" OR abs:"optimal allocation" OR abs:"nested sampling" OR abs:"variance decomposition" OR abs:"analysis of variance") AND (abs:"reinforcement learning" OR abs:"policy gradient" OR abs:"Monte Carlo")'
    - id: q_import_queueing
      stream: import
      themes: [L3]
      q: '(abs:queueing OR abs:"queueing theory" OR abs:"tail latency" OR abs:"stragglers") AND (abs:LLM OR abs:inference OR abs:rollout)'
    - id: q_import_vv
      stream: import
      themes: [L5]
      q: '(abs:"verification and validation" OR abs:"manufactured solutions" OR abs:"model-form uncertainty" OR abs:"solution verification") AND (abs:simulation OR abs:solver OR abs:"physics engine")'
    - id: q_import_reliability_eng
      stream: import
      themes: [L1]
      q: '(abs:"reliability engineering" OR abs:"mean time" OR abs:"failure rate" OR abs:metrology) AND (abs:LLM OR abs:agent OR abs:"AI system")'

  # Watchlist: fetch new papers by these authors (arXiv au: field). Names are search strings, not identities.
  authors:
    - { name: "Narasimhan_Karthik", why: "advisor target; τ-family, hyper-τ, Odysseus, EasyPPO", themes: [L1, L2] }
    - { name: "Netravali", why: "systems route; rollout and serving systems", themes: [L3] }
    - { name: "Tri Dao", why: "KV / attention systems", themes: [L3] }
    - { name: "Wyatt Lloyd", why: "systems route; rebranding toward ML systems", themes: [L3] }
    - { name: "Sayash Kapoor", why: "HAL; agent evaluation", themes: [L1] }
    - { name: "Arvind Narayanan", why: "HAL; AI Agents That Matter", themes: [L1] }
    - { name: "Ofir Press", why: "SWE-bench, SWE-agent lineage", themes: [L1, L2] }
    - { name: "Shunyu Yao", why: "ReAct, Reflexion, τ-bench", themes: [L1, L4] }
    - { name: "Danqi Chen", why: "Princeton NLP; post-training", themes: [L2] }
    - { name: "Sanjeev Arora", why: "theory; PLI", themes: [L2] }
    - { name: "Kazemnejad", why: "VinePPO", themes: [L2] }
    - { name: "Schölkopf", why: "ABC, Skill-or-Luck (control variates)", themes: [L2, L1] }

  # Paper watchlist: anything citing these is a seed (needs Semantic Scholar; degraded without a key).
  cited_by:
