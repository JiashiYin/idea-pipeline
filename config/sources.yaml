# Streams the fetchers read. Three kinds, by what they are good for:
#   adjacent-lab : what the groups around the themes are doing (arXiv by query and by author/paper)
#   import       : other fields' standard answers to the same problem shapes
#   complaint    : what practitioners cannot do (GitHub issues, limitations sections, workshop calls)
# X / Rednote are not streams; if something trends there, add it by hand with stream: manual.

version: 2026-10-01

arxiv:
  base_url: https://export.arxiv.org/api/query
  pause_seconds: 3            # arXiv's stated policy
  window_days: 7
  max_results_per_query: 50
  categories: [cs.LG, cs.CL, cs.AI, cs.DC, cs.SE]
  # Query syntax is arXiv's: field:term, AND/OR/ANDNOT, quotes for phrases. Keep each query narrow;
  # breadth comes from having several. Every query names the stream and the theme hint.
  queries:
    - id: q_credit_agents
      stream: adjacent-lab
      themes: [T1]
      q: '(abs:"credit assignment" OR abs:"step-level" OR abs:"turn-level") AND (abs:agent OR abs:agentic OR abs:"tool use") AND (abs:"reinforcement learning" OR abs:GRPO OR abs:"policy optimization")'
    - id: q_fork_rollouts
      stream: adjacent-lab
      themes: [T1]
      q: '(abs:fork OR abs:forking OR abs:branching OR abs:"tree-structured" OR abs:vine OR abs:counterfactual) AND (abs:rollout OR abs:rollouts) AND (abs:"reinforcement learning" OR abs:GRPO OR abs:"policy optimization")'
    - id: q_entropy_tokens
      stream: adjacent-lab
      themes: [T1]
      q: '(abs:entropy) AND (abs:"forking tokens" OR abs:"critical tokens" OR abs:"decision tokens" OR abs:"high-entropy") AND (abs:RLVR OR abs:GRPO OR abs:"reinforcement learning")'
    - id: q_swe_rl
      stream: adjacent-lab
      themes: [T1]
      q: '(abs:"SWE-bench" OR abs:"SWE-Gym" OR abs:"software engineering agent" OR abs:"coding agent" OR abs:"repository") AND (abs:"reinforcement learning" OR abs:GRPO OR abs:"policy optimization")'
    - id: q_rollout_systems
      stream: adjacent-lab
      themes: [T1]
      q: '(abs:rollout OR abs:"KV cache" OR abs:"prefix caching" OR abs:snapshot) AND (abs:"reinforcement learning" OR abs:RLHF OR abs:"post-training") AND (abs:throughput OR abs:scheduler OR abs:serving OR abs:"system")'
    - id: q_opd_privileged
      stream: adjacent-lab
      themes: [T2]
      q: '(abs:"self-distillation" OR abs:"on-policy distillation" OR abs:"privileged information" OR abs:"privileged context" OR abs:"privileged teacher") AND (abs:"language model" OR abs:LLM OR abs:agent) AND (abs:"reinforcement learning" OR abs:policy OR abs:verifier OR abs:reward)'
    - id: q_hindsight
      stream: adjacent-lab
      themes: [T1, T2]
      q: '(abs:hindsight) AND (abs:"language model" OR abs:LLM OR abs:agent OR abs:"policy optimization" OR abs:"credit assignment")'
    - id: q_audit_signals
      stream: adjacent-lab
      themes: [T1, T2]
      q: '(abs:"process reward" OR abs:"dense reward" OR abs:"step reward") AND (abs:audit OR abs:"ground truth" OR abs:"shuffled" OR abs:"does not" OR abs:"fails") AND (abs:agent OR abs:LLM)'
    # import stream: other fields' answers to allocation / credit / variance problems
    - id: q_import_doe
      stream: import
      themes: [T1]
      q: '(abs:"Neyman allocation" OR abs:"optimal allocation" OR abs:"nested sampling" OR abs:"variance decomposition" OR abs:"analysis of variance") AND (abs:"reinforcement learning" OR abs:"policy gradient" OR abs:"Monte Carlo")'
    - id: q_import_control
      stream: import
      themes: [T1, T2]
      q: '(abs:"control as inference" OR abs:"posterior policy" OR abs:"success-conditioned" OR abs:"goal-conditioned" OR abs:"return-conditioned") AND (abs:"policy gradient" OR abs:"policy optimization")'
    - id: q_import_bandits
      stream: import
      themes: [T1]
      q: '(abs:"value of information" OR abs:"knowledge gradient" OR abs:"expected information gain") AND (abs:"reinforcement learning" OR abs:rollout OR abs:"tree search")'

  # Watchlist: fetch new papers by these authors (arXiv au: field). Names are search strings, not
  # identities; expand_labs.py proposes additions, Jacob approves. Start small.
  authors:
    - { name: "Netravali", why: "Gambit; SAIL@Princeton rollout systems", themes: [T1] }
    - { name: "Tri Dao", why: "Gambit; KV/attention systems", themes: [T1] }
    - { name: "Kazemnejad", why: "VinePPO", themes: [T1] }
    - { name: "Harutyunyan", why: "Hindsight Credit Assignment", themes: [T2] }
    - { name: "Haiyue Zhang", why: "Credit Without Ground Truth", themes: [T1] }
    - { name: "Hübotter", why: "SDPO", themes: [T2] }
    - { name: "Narutatsu Ri", why: "Rethinking OPSD", themes: [T2] }
    - { name: "Liam Fowl", why: "Rethinking OPSD", themes: [T2] }
    - { name: "Sanjeev Arora", why: "Rethinking OPSD; theory", themes: [T2] }
    - { name: "Danqi Chen", why: "Princeton NLP; post-training", themes: [T1, T2] }

  # Paper watchlist: anything citing these is a seed (needs Semantic Scholar; degraded without a key).
  cited_by:
    - { id: "2410.01679", title: "VinePPO" }
    - { id: "1912.02503", title: "Hindsight Credit Assignment" }
    - { id: "2608.19760", title: "Credit Without Ground Truth" }
    - { id: "2609.20004", title: "EPIG-Tree" }
    - { id: "2609.11061", title: "Belief-Shift Branching" }
    - { id: "2604.11037", title: "RTMC" }
    - { id: "2606.09348", title: "PBSD" }
    - { id: "2607.05184", title: "Rethinking OPSD for Thinking Models" }
    - { id: "2608.08020", title: "Gambit" }

github:
  api: https://api.github.com
  token_env: GITHUB_TOKEN
  window_days: 14
  # issues matching any keyword, open or closed within the window; the "complaint" stream
  repos:
    - { repo: volcengine/verl, keywords: [rollout, tree, branch, snapshot, "KV", "prefix cache", advantage, "step-level", async] }
    - { repo: NovaSky-AI/SkyRL, keywords: [rollout, tree, branch, snapshot, advantage, sandbox] }
    - { repo: All-Hands-AI/OpenHands, keywords: [sandbox, snapshot, checkpoint, "fork", trajectory, RL] }
    - { repo: SWE-Gym/SWE-Gym, keywords: [rollout, RL, trajectory, container, snapshot] }
    - { repo: SWE-bench/SWE-smith, keywords: [RL, trajectory, container, snapshot] }
    - { repo: vllm-project/vllm, keywords: ["prefix cache", "prompt_logprobs", cascade, "KV cache", RL, rollout] }
    - { repo: sgl-project/sglang, keywords: ["radix", "KV cache", rollout, RL, "cascade"] }

conference_exports:
  # Downloads pages list accepted titles (and sometimes abstracts) months before camera-ready.
  # fetch_exports.py builds a local title/abstract index; the kill search queries it.
  venues:
    - { venue: NeurIPS, year: 2026, url: "https://neurips.cc/Downloads/2026", camera_ready: "2026-10-04" }
    - { venue: ICLR, year: 2027, url: "https://iclr.cc/Downloads/2027", note: "appears after decisions, ~Jan 2027" }
    - { venue: ICML, year: 2027, url: "https://icml.cc/Downloads/2027", note: "appears ~May 2027" }
  openreview_venues:
    - "ICLR.cc/2027/Conference"   # submissions visible during review season

workshops_and_cfps:
  # read by hand monthly; each CFP's topic list is a complaint stream in disguise
  - "NeurIPS 2026 workshops: AgenticOS; Agentic AI Benchmark; AI for Meta-Science"
  - "MLSys 2027 CFP: large-scale RL for LLMs and agentic systems"
  - "ICML 2027 workshops: watch for RL-for-LLMs, agents, systems"

limitations_sections:
  # kept cards whose limitations sections are worth re-reading as complaints; expand_labs proposes
  seed_from: data/cards
  rule: "every kept card's limitations paragraph becomes a complaint seed with stream: paper-limitations"
