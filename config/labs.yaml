    role: campus; infra_builders
    why: Gambit (test-time search sharing KV across clones); rollout and serving systems; the natural home for the systems half.
    seed_papers: ["2608.08020"]
    status: verified
    evidence: "SAIL site and Gambit paper, Sept 2026"
