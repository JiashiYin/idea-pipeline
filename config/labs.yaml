# Tiered lab map. Tier 0 is seeded by hand from the fork-placement project (Sept 2026); everything after
# is grown by scripts/expand_labs.py from kept cards and promoted only after appearances >= 3 in distinct
# weeks. status: unverified until a page confirming the role has been opened and recorded in `evidence`.
# Roles: campus | problem_setters | infra_builders | measurers | reviewers.
# "why" is one plain sentence. Do not add a group because it is famous.

version: 2026-10-01

